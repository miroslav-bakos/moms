name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-release-gates.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-validate-release.py
      - run: sh scripts/verify-db.sh
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            testing/package-lock.json
      - run: npm ci
      - run: npm ci --prefix testing
      - run: npx --prefix testing playwright install --with-deps chromium
      - run: npm run verify:ui

name: Desktop bundles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Prepare pinned Unix runtimes
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/prepare-desktop-runtime.sh "$RUNNER_TEMP/moms-runtime"
      - name: Prepare pinned Windows runtimes
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/prepare-desktop-runtime.ps1 -Destination "$env:RUNNER_TEMP/moms-runtime"
      - name: Build and verify native bundle
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          node scripts/build-desktop.js --output "$RUNNER_TEMP/moms-bundle" --node "$RUNNER_TEMP/moms-runtime/node$suffix" --postgres "$RUNNER_TEMP/moms-runtime/postgresql"
          node scripts/check-desktop.js --ipc
          node scripts/check-desktop-install.js --bundle "$RUNNER_TEMP/moms-bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: moms-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/moms-bundle
          retention-days: 14

name: Desktop bundles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            arch: x64
          - runner: ubuntu-22.04-arm
            target: raspberry-pi-arm64
            arch: arm64
          - runner: macos-14
            target: macos-apple-silicon
            arch: arm64
          - runner: macos-15-intel
            target: macos-intel
            arch: x64
          - runner: windows-2022
            target: windows-x64
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Verify native architecture
        shell: bash
        run: node -e "if(process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev
      - run: npm ci
      - run: npm run verify
      - name: Prepare pinned Unix runtimes
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/prepare-desktop-runtime.sh "$RUNNER_TEMP/moms-runtime"
      - name: Prepare pinned Windows runtimes
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/prepare-desktop-runtime.ps1 -Destination "$env:RUNNER_TEMP/moms-runtime"
      - name: Build and verify native bundle
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = 'Windows' ]; then suffix='.exe'; fi
          node scripts/build-desktop.js --output "$RUNNER_TEMP/moms-bundle" --node "$RUNNER_TEMP/moms-runtime/node$suffix" --postgres "$RUNNER_TEMP/moms-runtime/postgresql"
          node scripts/check-desktop.js --ipc
      - name: Archive bundle with executable permissions
        shell: bash
        run: |
          archive_dir="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = 'Windows' ]; then archive_dir="$(cygpath -u "$RUNNER_TEMP")"; fi
          cd "$archive_dir"
          tar -czf "moms-${{ matrix.target }}.tar.gz" moms-bundle
          node -e "const fs=require('node:fs'),crypto=require('node:crypto');const p=process.env.RUNNER_TEMP+'/moms-${{ matrix.target }}.tar.gz';fs.writeFileSync(p+'.sha256',crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')+'  moms-${{ matrix.target }}.tar.gz\n')"
      - name: Verify native installation, updates and recovery
        shell: bash
        run: node scripts/check-desktop-install.js --bundle "$RUNNER_TEMP/moms-bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: moms-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/moms-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/moms-${{ matrix.target }}.tar.gz.sha256
          compression-level: 0
          retention-days: 14

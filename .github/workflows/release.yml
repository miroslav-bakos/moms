name: Publish verified pilot release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Desktop bundles run ID
        required: true
      verify_run_id:
        description: Successful Verify run ID for the same main commit
        required: true
      target_sha:
        description: Reviewed release source commit
        required: true
      tag:
        description: Version tag matching bundle manifests
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      VERIFY_RUN_ID: ${{ inputs.verify_run_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify release safety checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-validate-release.py
      - name: Verify successful trusted build
        shell: bash
        run: |
          if [[ "$TARGET_SHA" != "$GITHUB_SHA" ]]; then
            echo 'Select the main commit used to dispatch this workflow; rebuild if main advanced.' >&2
            exit 1
          fi
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$VERIFY_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build.json"
          gh api "repos/$GH_REPO/actions/runs/$VERIFY_RUN_ID" > "$RUNNER_TEMP/verify.json"
          git fetch origin main --tags
          python3 .github/scripts/validate-release-gates.py "$RUNNER_TEMP/build.json" "$RUNNER_TEMP/verify.json" "$TARGET_SHA" "$RELEASE_TAG" "$GH_REPO"
      - name: Check out verified release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-artifacts
      - name: Verify checksums, source, privacy boundaries and installers
        run: python3 .github/scripts/validate-release.py "$RUNNER_TEMP/native-artifacts" "$RELEASE_TAG"
      - name: Publish pilot release
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/native-artifacts/*/*.tar.gz "$RUNNER_TEMP"/native-artifacts/*/*.sha256 --target "$TARGET_SHA" --title "MOMS $RELEASE_TAG — pilot" --notes-file .github/RELEASE-NOTES.md --prerelease
          gh release view "$RELEASE_TAG" --json url,isDraft,isPrerelease,assets --jq '{url,isDraft,isPrerelease,assets:[.assets[].name]}'
